<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<img src="imagemITA.jpg" class="fundo-login">
<body id="login-body" name="login-body">
    <h1 id="login-title">Instituto Tecnológico de Aeronáutica</h1>
    <form action="/login" method="post">
        <label for="Username-label" id="Username-label">Username</label><br>
        <input type="text" id="username" name="username" placeholder="Please enter your username." required>
        <br>
        <label for="Password-label" id="Password-label">Password</label><br>
        <input type="password" id="password" name="password" placeholder="Please enter your password." required>
        <br>
        <button type="submit" id="login-button">Access</button>
    </form>
</body>
</html>
