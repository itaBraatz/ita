<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<img src="imagemITA.jpg" class="fundo-login">
<body id="login-body" name="login-body">
    <h1 id="login-title">Instituto Tecnológico de Aeronáutica</h1>
    <form action="/login" method="post">
        <label for="Username-label" id="Username-label">Username</label><br>
        <input type="text" id="username" name="username" placeholder="Please enter your username." required>
        <br>
        <label for="Password-label" id="Password-label">Password</label><br>
        <input type="password" id="password" name="password" placeholder="Please enter your password." required>
        <br>
        <label id="escolha-ano">Year</label>
        <br>
        <select id="year" name="year" required>
            <option value="">Select a year</option>
            <option value="2026">2026st Year</option>
            <option value="2025">2025st Year</option>
            <option value="2024">2024st Year</option>
        </select>
        <label id="escolha-materia">Matter</label>
        <br>
        <select id="matter" name="matter" required>
            <option value="">Select a matter</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
        </select>
        <button type="submit" id="login-button">Access</button>
    </form>
</body>
</html>
